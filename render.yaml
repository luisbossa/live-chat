# Blueprint de Render: https://render.com/docs/blueprint-spec
# En Render: New → Blueprint → elige este repositorio. Crea el servicio, el disco y las variables.
services:
  - type: web
    name: yabla-chat
    runtime: node
    # Los discos persistentes requieren un plan de pago (Starter o superior).
    # Sin disco, la base de datos y las subidas se borrarían en cada despliegue.
    plan: starter
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: yabla-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Render genera una clave aleatoria segura en el primer despliegue
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/yabla.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      # true = crea los usuarios demo si la base de datos está vacía. Pon false cuando abras la app al público.
      - key: SEED_DEMO
        value: "true"
      - key: ICE_SERVERS
        value: '[{"urls":"stun:stun.l.google.com:19302"},{"urls":"stun:stun1.l.google.com:19302"}]'
      # BASE_URL no hace falta: se usa RENDER_EXTERNAL_URL. Defínela solo si usas un dominio propio.
