# Blueprint de Render (plan gratuito): https://render.com/docs/blueprint-spec
# En Render: New → Blueprint → elige este repositorio.
# Render te pedirá TURSO_DATABASE_URL y TURSO_AUTH_TOKEN (la base de datos gratuita en Turso).
services:
  - type: web
    name: yabla-chat
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Render genera una clave aleatoria segura en el primer despliegue
      - key: SESSION_SECRET
        generateValue: true
      # Base de datos en Turso: Render las pide al crear el Blueprint (no se guardan en el repo)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # true = crea los usuarios demo si la base de datos está vacía. Pon false al abrir la app al público.
      - key: SEED_DEMO
        value: "true"
      - key: ICE_SERVERS
        value: '[{"urls":"stun:stun.l.google.com:19302"},{"urls":"stun:stun1.l.google.com:19302"}]'
      # Notificaciones push: opcionales (si faltan, se generan y guardan en la base de datos).
      # Genéralas con: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hola@yabla.app
      # BASE_URL no hace falta: se usa RENDER_EXTERNAL_URL. Defínela solo si usas un dominio propio.
