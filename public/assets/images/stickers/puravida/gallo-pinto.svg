<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs><filter id="o" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
  <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/>
  <feFlood flood-color="#fff"/><feComposite in2="d" operator="in" result="w"/>
  <feGaussianBlur in="d" stdDeviation="3.5"/><feOffset dy="4" result="b"/>
  <feFlood flood-color="#1a1530" flood-opacity=".22"/><feComposite in2="b" operator="in" result="s"/>
  <feMerge><feMergeNode in="s"/><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter></defs>
<style>
.a{transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%,100%{transform:scale(1) rotate(var(--r,0deg))}50%{transform:scale(1.06) rotate(var(--r,0deg))}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.12)}28%{transform:scale(1)}42%{transform:scale(1.08)}}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes rise{0%{transform:translateY(8px);opacity:0}30%{opacity:.9}100%{transform:translateY(-26px);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.4}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(0)}94%{transform:scaleY(1)}}
@keyframes float{0%{transform:translate(0,6px) scale(.7);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx,0),-40px) scale(1);opacity:0}}
</style>

<g filter="url(#o)">
  <g fill="none" stroke="#d6cbe0" stroke-width="5" stroke-linecap="round">
    <path class="a" d="M80 44 q-6 -8 0 -16 q6 -8 0 -16" style="animation:rise 2.4s ease-in infinite"/>
    <path class="a" d="M120 44 q-6 -8 0 -16 q6 -8 0 -16" style="animation:rise 2.4s 1.2s ease-in infinite"/>
  </g>
  <ellipse cx="100" cy="112" rx="84" ry="48" fill="#f3f1fb"/>
  <ellipse cx="100" cy="108" rx="70" ry="38" fill="#fff"/>
  <path d="M38 108 Q42 76 82 74 Q112 74 116 100 Q114 134 74 136 Q40 134 38 108Z" fill="#f2e6cf"/>
  <g fill="#5a2b2e">
    <ellipse cx="56" cy="96" rx="4" ry="3"/><ellipse cx="70" cy="86" rx="4" ry="3"/><ellipse cx="86" cy="94" rx="4" ry="3"/>
    <ellipse cx="62" cy="114" rx="4" ry="3"/><ellipse cx="80" cy="110" rx="4" ry="3"/><ellipse cx="98" cy="104" rx="4" ry="3"/>
    <ellipse cx="72" cy="124" rx="4" ry="3"/><ellipse cx="92" cy="122" rx="4" ry="3"/><ellipse cx="50" cy="110" rx="3.5" ry="2.6"/>
    <ellipse cx="102" cy="88" rx="3.5" ry="2.6"/><ellipse cx="84" cy="78" rx="3.5" ry="2.6"/>
  </g>
  <path d="M106 96 Q112 70 140 74 Q164 80 158 102 Q150 122 128 118 Q104 116 106 96Z" fill="#fff" stroke="#efe9df" stroke-width="2"/>
  <circle cx="134" cy="96" r="13" fill="#ffb31f"/><circle cx="130" cy="92" r="4" fill="#ffd975"/>
  <g fill="#f0a63a" stroke="#c4741a" stroke-width="2">
    <ellipse cx="116" cy="132" rx="16" ry="8" transform="rotate(-12 116 132)"/>
    <ellipse cx="144" cy="126" rx="16" ry="8" transform="rotate(-24 144 126)"/>
  </g>
  <g transform="rotate(-5 100 176)">
    <rect x="40" y="160" width="120" height="30" rx="15" fill="#5a2b2e"/>
    <text x="100" y="181" text-anchor="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="17" fill="#ffe2b8">Gallo pinto</text>
  </g>
</g>

</svg>
