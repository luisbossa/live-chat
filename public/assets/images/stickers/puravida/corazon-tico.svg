<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs><filter id="o" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
  <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/>
  <feFlood flood-color="#fff"/><feComposite in2="d" operator="in" result="w"/>
  <feGaussianBlur in="d" stdDeviation="3.5"/><feOffset dy="4" result="b"/>
  <feFlood flood-color="#1a1530" flood-opacity=".22"/><feComposite in2="b" operator="in" result="s"/>
  <feMerge><feMergeNode in="s"/><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter></defs>
<style>
.a{transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%,100%{transform:scale(1) rotate(var(--r,0deg))}50%{transform:scale(1.06) rotate(var(--r,0deg))}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.12)}28%{transform:scale(1)}42%{transform:scale(1.08)}}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes rise{0%{transform:translateY(8px);opacity:0}30%{opacity:.9}100%{transform:translateY(-26px);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.4}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(0)}94%{transform:scaleY(1)}}
@keyframes float{0%{transform:translate(0,6px) scale(.7);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx,0),-40px) scale(1);opacity:0}}
</style>

<defs><clipPath id="h"><path d="M100,158.85714285714286 C18.0,94.42857142857143 35.57142857142857,24.142857142857153 73.64285714285714,24.142857142857153 C91.21428571428572,24.142857142857153 100,38.78571428571429 100,47.57142857142857 C100,38.78571428571429 108.78571428571428,24.142857142857153 126.35714285714286,24.142857142857153 C164.42857142857144,24.142857142857153 182.0,94.42857142857143 100,158.85714285714286Z" fill="#000" /></clipPath></defs>
<g filter="url(#o)">
  <g class="a" style="animation:beat 1.6s ease-in-out infinite">
    <g clip-path="url(#h)">
      <rect x="0" y="0" width="200" height="56" fill="#1f4fbf"/>
      <rect x="0" y="56" width="200" height="22" fill="#fff"/>
      <rect x="0" y="78" width="200" height="42" fill="#e3263b"/>
      <rect x="0" y="120" width="200" height="22" fill="#fff"/>
      <rect x="0" y="142" width="200" height="60" fill="#1f4fbf"/>
      <ellipse cx="66" cy="62" rx="22" ry="12" fill="#fff" opacity=".25"/>
    </g>
  </g>
  <path class="a" d="M32,27 Q33.95,38.05 45,40 Q33.95,41.95 32,53 Q30.05,41.95 19,40 Q30.05,38.05 32,27Z" fill="#ffd23f" style="animation:twinkle 1.8s 0s ease-in-out infinite"/><path class="a" d="M170,26 Q171.5,34.5 180,36 Q171.5,37.5 170,46 Q168.5,37.5 160,36 Q168.5,34.5 170,26Z" fill="#ffd23f" style="animation:twinkle 1.8s 0.6s ease-in-out infinite"/><path class="a" d="M176,151 Q177.35,158.65 185,160 Q177.35,161.35 176,169 Q174.65,161.35 167,160 Q174.65,158.65 176,151Z" fill="#ffd23f" style="animation:twinkle 1.8s 1.1s ease-in-out infinite"/>
</g>

</svg>
