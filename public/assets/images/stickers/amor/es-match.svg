<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs><filter id="o" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
  <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/>
  <feFlood flood-color="#fff"/><feComposite in2="d" operator="in" result="w"/>
  <feGaussianBlur in="d" stdDeviation="3.5"/><feOffset dy="4" result="b"/>
  <feFlood flood-color="#1a1530" flood-opacity=".22"/><feComposite in2="b" operator="in" result="s"/>
  <feMerge><feMergeNode in="s"/><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter></defs>
<style>
.a{transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%,100%{transform:scale(1) rotate(var(--r,0deg))}50%{transform:scale(1.06) rotate(var(--r,0deg))}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.12)}28%{transform:scale(1)}42%{transform:scale(1.08)}}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes rise{0%{transform:translateY(8px);opacity:0}30%{opacity:.9}100%{transform:translateY(-26px);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.4}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(0)}94%{transform:scaleY(1)}}
@keyframes float{0%{transform:translate(0,6px) scale(.7);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx,0),-40px) scale(1);opacity:0}}
</style>

<g filter="url(#o)">
  <g class="a" style="--r:-12deg;animation:pop 1.2s ease-in-out infinite"><path d="M76,117.14285714285714 C32.0,82.57142857142857 41.42857142857143,44.85714285714286 61.85714285714286,44.85714285714286 C71.28571428571429,44.85714285714286 76,52.714285714285715 76,57.42857142857143 C76,52.714285714285715 80.71428571428571,44.85714285714286 90.14285714285714,44.85714285714286 C110.57142857142857,44.85714285714286 120.0,82.57142857142857 76,117.14285714285714Z" fill="#ff3d6e" /></g>
  <g class="a" style="--r:12deg;animation:pop 1.2s .6s ease-in-out infinite"><path d="M124,117.14285714285714 C80.0,82.57142857142857 89.42857142857143,44.85714285714286 109.85714285714286,44.85714285714286 C119.28571428571429,44.85714285714286 124,52.714285714285715 124,57.42857142857143 C124,52.714285714285715 128.71428571428572,44.85714285714286 138.14285714285714,44.85714285714286 C158.57142857142856,44.85714285714286 168.0,82.57142857142857 124,117.14285714285714Z" fill="#ff8fab" /></g>
  <path class="a" d="M100,26 Q101.8,36.2 112,38 Q101.8,39.8 100,50 Q98.2,39.8 88,38 Q98.2,36.2 100,26Z" fill="#ffd23f" style="animation:twinkle 1.8s 0s ease-in-out infinite"/>
  <text x="100" y="168" text-anchor="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-style="italic" font-size="30" fill="#fff" stroke="#e0457b" stroke-width="8" paint-order="stroke" transform="rotate(-6 100 160)">¡Es match!</text>
  <path class="a" d="M28,111 Q29.35,118.65 37,120 Q29.35,121.35 28,129 Q26.65,121.35 19,120 Q26.65,118.65 28,111Z" fill="#ffd23f" style="animation:twinkle 1.8s 0.7s ease-in-out infinite"/>
</g>

</svg>
