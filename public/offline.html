<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f7">
  <title>Sin conexión - Yabla</title>
  <link rel="icon" href="/assets/images/pwa/icon-192.png" type="image/png">
  <style>
    :root { color-scheme: light dark; --bg: #f7f7f7; --ink: #262424; --text: #6b6d70; --card: #fff; --line: #e3e4e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121212; --ink: #f2f2f2; --text: #a2a4a8; --card: #1d1d1d; --line: #2c2c2c; } }
    * { box-sizing: border-box; }
    body {
      display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px;
      background: var(--bg); color: var(--text);
      font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    main { display: grid; justify-items: center; gap: 10px; max-width: 360px; }
    .logo {
      display: grid; place-items: center; width: 84px; height: 84px; margin-bottom: 8px;
      border-radius: 26px; background: #262424; box-shadow: 0 18px 36px -16px rgba(0, 0, 0, .55);
    }
    .logo img { height: 46px; }
    .dot { position: relative; }
    .dot::after {
      content: ""; position: absolute; right: -4px; bottom: -4px; width: 22px; height: 22px;
      border: 4px solid var(--bg); border-radius: 50%; background: #f5a524;
    }
    h1 { margin: 0; color: var(--ink); font-size: 22px; letter-spacing: -.02em; }
    p { margin: 0 0 8px; }
    button {
      height: 46px; padding: 0 26px; border: 0; border-radius: 999px;
      background: var(--ink); color: var(--bg); font: 600 15px inherit; font-family: inherit; cursor: pointer;
    }
    small { margin-top: 6px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="logo dot"><img src="/assets/images/ui/logo.png" alt=""></div>
    <h1>Estás sin conexión</h1>
    <p>Revisa tu internet. Tus chats te esperan: Yabla se reconectará en cuanto vuelva la señal.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
    <small>Se recargará sola al recuperar la conexión.</small>
  </main>
  <script>addEventListener("online", () => location.reload());</script>
</body>
</html>
